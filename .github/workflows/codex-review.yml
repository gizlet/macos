name: Codex review

# Reviews the pull-request diff with Codex and reports the `Codex Code Review`
# check. It runs for a comment with a `/codex-review` line, posted by gizlet-bot
# when the pull request is opened or updated, or by a writer to review again.
# Runs on GitHub-hosted runners and never executes pull-request code.
# See https://github.com/gizlet/.github.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review.
        required: false
        default: ''
        type: string
      head_sha:
        description: Expected pull-request head; a moved head is skipped.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    # Every new comment starts this workflow; only one with a /codex-review line goes on.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '/codex-review'))
    concurrency:
      group: codex-review-${{ inputs.pull_request_number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: gizlet/.github/.github/workflows/codex-review.yml@latest
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}
      review-instructions: >-
        Gizlet for macOS is a native Swift and SwiftUI launcher that installs and
        runs Gizlet apps from .gzl packages and the Gizlet Store, keeps per-profile
        saves, favorites and preferences, writes Gizlet OS images to SD cards for
        the R36S, and updates itself from a signed manifest on R2. Pay particular
        attention to disk-writing target validation (never the system disk or an
        internal non-removable disk, a card swapped after confirmation is refused,
        raw device handling and read-back verification), privilege boundaries
        (authopen and anything run with administrator rights, launching package
        executables, release credentials reaching pull-request builds), update
        verification (manifest signature, archive SHA-256, code signature and
        team checks, and keeping the current version when any check fails), and
        profile data protection (uninstall and update keep every profile's saves,
        profile deletion and switching, path traversal from package contents).
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
